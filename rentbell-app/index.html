<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RentBell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff9f1c'/%3E%3Cpath d='M14 31 32 15l18 16v17a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z' fill='none' stroke='%23082b2e' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='m24 36 6 6 11-12' fill='none' stroke='%23082b2e' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b4f49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RentBell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.RB_PWA=true;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One fixed dark theme, so it looks the same in every browser. Layout idea: a wallet-style rent app. Deep teal hero with a collection ring, floating cards with a glowing status edge, saffron for the one main action. */
:root{
  color-scheme:dark;
  --bg:#061315; --card:#0e2327; --ink:#eaf6f4; --muted:#93abad; --line:#1d3b40; --field:#0a1b1e;
  --hero1:#0b4f49; --hero2:#081c30; --on-hero:#ffffff; --accent:#ffad3b; --accent-ink:#2b1800;
  --ok:#4fd6a0; --ok-bg:#0d3528; --warn:#ffc86b; --warn-bg:#3d2d0c; --bad:#ff8d83; --bad-bg:#451f1c;
  --wa:#17a358; --shadow:0 8px 24px rgba(0,0,0,.35);
  --display:"Outfit","Mukta",system-ui,sans-serif;
  --body:"Mukta","Noto Sans Malayalam","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.m::after{content:attr(data-v)}
body.hide .mask .m::after{content:"\20B9\00a0\2022\2022\2022\2022\2022";letter-spacing:.04em}

header{background:radial-gradient(120% 90% at 100% 0%,rgba(255,159,28,.28),transparent 55%),linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--on-hero);padding:18px 0 30px;border-radius:0 0 28px 28px;overflow:hidden}
@media (min-width:600px){header{max-width:560px;margin:16px auto 0;border-radius:28px}}
.top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:none}
.brand{font-family:var(--display);font-size:23px;font-weight:700;line-height:1;flex:1;letter-spacing:-.01em}
.brand small{display:flex;align-items:center;gap:6px;font-family:var(--body);font-weight:400;font-size:12px;opacity:.8;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.ok{background:#5be0a8}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:var(--on-hero);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.hero{display:flex;align-items:center;gap:20px;margin-top:24px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.16)} .ring .pr{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;line-height:1}
.ring b small{display:block;font-family:var(--body);font-size:11px;font-weight:400;opacity:.8;margin-top:2px;text-align:center}
.figs{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.figs>div>span{display:block;font-size:12.5px;opacity:.8}
.figs b{font-family:var(--display);font-size:27px;line-height:1.1;letter-spacing:-.01em}
.figs .pend b{color:var(--accent)}
.figs .small b{font-size:19px}

main.wrap{padding-top:24px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:17px;font-weight:700;margin:14px 0 0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .count{font-family:var(--body);font-size:13px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:99px;padding:0 9px}
.hint{color:var(--muted);font-size:14.5px;margin:0;line-height:1.55}
.card{background:var(--card);border-radius:22px;padding:18px;position:relative;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line);color:var(--ink)}
.card.late{border-color:var(--bad)} .card.due{border-color:var(--accent)} .card.soon{border-color:var(--warn)}
button.card{text-align:left;width:100%}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none;font-size:16px}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere;line-height:1.25}
.sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.amt{font-family:var(--display);font-size:21px;font-weight:700;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.late{background:var(--bad-bg);color:var(--bad)} .pill.due,.pill.soon,.pill.part,.pill.mid{background:var(--warn-bg);color:var(--warn)}
.pill.clear,.pill.good{background:var(--ok-bg);color:var(--ok)} .pill.new{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.msg{background:var(--field);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;width:100%;display:block}
.msg .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.open .clamp{display:block}
.tip{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.tip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:14px;min-height:46px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn:active,.card:active{transform:scale(.985)}
.btn.wa{background:var(--wa);color:#fff;border-color:transparent;flex:1 1 180px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none;flex-wrap:wrap}
.langs button{border:0;background:transparent;min-width:40px;min-height:36px;padding:0 8px;font-weight:600;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langs.big button{min-height:46px;padding:0 13px;font-size:15.5px}
.welcome ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--line);min-height:4px}
.bars i.on{background:var(--accent)} .bars small{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{flex:1;text-align:center;font-family:var(--display);font-size:19px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:12px;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.list .li:first-child{border-top:0}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:600}

nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:center;pointer-events:none}
nav .in{pointer-events:auto;width:100%;max-width:536px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);padding:6px}
nav button{border:0;background:none;min-height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav svg{width:22px;height:22px}
.fab{position:fixed;right:16px;bottom:96px;z-index:6;box-shadow:0 8px 22px rgba(255,159,28,.4);border-radius:99px;min-height:52px;padding:0 20px}

.veil{position:fixed;inset:0;background:rgba(3,14,16,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93%;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-family:var(--display);font-size:21px;margin:0;flex:1;overflow-wrap:anywhere}
label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:48px;padding:8px 12px;font-size:16px;color:var(--ink);font-weight:500;width:100%}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500;color:var(--ink);font-size:15px;min-height:40px}
.check input{width:22px;height:22px;flex:none;accent-color:var(--wa)}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.done{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto}
body.locked header,body.locked main,body.locked nav,body.locked #layer{display:none}
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
#lock .box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#lock h1{font-family:var(--display);font-size:26px;margin:0}
#lock input{text-align:center;font-size:26px;letter-spacing:.3em;min-height:58px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:16px;width:100%;padding:8px}
#lock p{margin:0;min-height:22px;font-weight:600;color:#ffd08a}
.updbar{position:fixed;left:12px;right:12px;bottom:92px;z-index:30;max-width:536px;margin:0 auto;background:var(--card);border:2px solid var(--accent);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:600}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
@media (max-width:360px){.two{grid-template-columns:1fr}.amt{font-size:18px}.ring{width:88px;height:88px}.figs b{font-size:23px}}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px);opacity:.6}}
  .done{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.5)}60%{transform:scale(1.12)}}
  .btn,.card{transition:transform .08s}
}
</style>
</head>
<body class="hide">
<header class="mask"><div class="wrap">
  <div class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#ff9f1c"/><path d="M14 31 32 15l18 16v17a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="none" stroke="#082b2e" stroke-width="4" stroke-linejoin="round"/><path d="m24 36 6 6 11-12" fill="none" stroke="#082b2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="brand">RentBell<small><i class="dot" id="syncDot"></i><span id="syncTxt">Opening your records</span></small></div>
    <button class="iconbtn" data-act="eye" id="eye" aria-label="Show amounts" aria-pressed="false"></button>
    <button class="iconbtn" data-act="settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <div class="hero" id="sum"></div>
</div></header>
<main class="wrap mask" id="main"></main>
<nav><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg>Today</button>
  <button data-tab="tenants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.500a6.500 6.500 0 0 1 3.500 5.500"/></svg>Tenants</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10M7 9h10M7 4c7 0 7 9 0 9l8 7"/></svg>Rent book</button>
</div></nav>
<div id="layer"></div>
<div id="lock" hidden><div class="box">
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#ff9f1c"/><path d="M14 31 32 15l18 16v17a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="none" stroke="#082b2e" stroke-width="4" stroke-linejoin="round"/><path d="m24 36 6 6 11-12" fill="none" stroke="#082b2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>RentBell is locked</h1>
  <label for="l-pin" style="color:#fff">Enter your PIN</label>
  <input type="password" id="l-pin" inputmode="numeric" autocomplete="off" maxlength="12">
  <p id="l-err" role="alert"></p>
  <button class="btn pri block" data-act="unlock">Unlock</button>
</div></div>

<script>
"use strict";
/* ---------- data ---------- */
const APP_VERSION="1.5";
const KEY="rentbell.v1", ME_KEY="rentbell.me";
/* Updates only replace the app's code. Records stay in this browser; a safety copy is kept each time the version changes. */
let justUpdated=false, newVersion="";
try{const lv=localStorage.getItem("rentbell.ver");if(lv!==APP_VERSION){const raw=localStorage.getItem(KEY);if(raw)localStorage.setItem("rentbell.safe",raw);localStorage.setItem("rentbell.ver",APP_VERSION);justUpdated=!!lv;}}catch(e){}
async function checkUpdate(){
  if(!window.RB_PWA||newVersion||document.hidden)return;
  try{const t=await (await fetch("index.html?v="+Date.now(),{cache:"no-store"})).text(), m=t.match(/const APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){newVersion=m[1];let b=document.getElementById("upd");if(!b){b=document.createElement("div");b.id="upd";b.className="updbar";b.setAttribute("role","status");document.body.appendChild(b);}
      b.innerHTML='<span class="grow">New version '+esc(newVersion)+' is ready. Your records stay as they are.</span><button class="btn pri sm" data-act="updatenow">Update now</button><button class="btn sm" data-act="updatelater">Later</button>';}}catch(e){}
}
let assetsNS=null, unlocked=false, hiddenAt=0, fails=0, lockUntil=0;
let mode="local", myId=null, amOwner=false, sheetUrl="", pendingLocal=false, deviceName="";
try{deviceName=localStorage.getItem(ME_KEY)||"";}catch(e){}
const myName=()=>deviceName||(amOwner?(state.settings.owner||"").trim():"")||"";
const fresh=()=>({v:1,updatedAt:0,settings:{owner:"",upi:"",lang:"en",cc:"91",mail:"",hide:true,before:true,daysBefore:3,onDue:true,daily:true},tenants:[],payments:[],charges:[],advances:[],units:[],readings:[]});
let state=fresh(), tab="today", viewMonth=null, openMsgs={}, reveal=false, revealTimer=null;
const arr=a=>Array.isArray(a)?a:[];
function normalize(s){const f=fresh();if(!s||typeof s!=="object")return f;
  return {v:1,updatedAt:+s.updatedAt||0,settings:Object.assign(f.settings,s.settings||{}),tenants:arr(s.tenants),payments:arr(s.payments),charges:arr(s.charges),advances:arr(s.advances),units:arr(s.units),readings:arr(s.readings)};}
try{const raw=localStorage.getItem(KEY);if(raw)state=normalize(JSON.parse(raw));}catch(e){}

let lastAuto=null, docRef=null, cloud="wait", saving=false, dirty=false, timer=null;
function setSync(){const d=document.getElementById("syncDot"),t=document.getElementById("syncTxt");
  const okTxt=mode==="shared"&&!amOwner?"Family rent book, saved":"Saved to your account";
  const m={wait:["","Opening your records"],ok:["ok",okTxt],saving:["","Saving"],local:["","Saved on this device only"]}[cloud];
  d.className="dot "+m[0];t.textContent=m[1];}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}saveForWorker();}
/* Installed-app build only: keep a copy where the background worker can read it, for the daily notification. */
function saveForWorker(){if(!window.RB_PWA||!("caches" in window))return;caches.open("rentbell-data").then(c=>c.put("state.json",new Response(JSON.stringify(state)))).catch(()=>{});}
let deferredInstall=null, installHidden=false;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;render();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;render();});
const isInstalled=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function installCard(){
  if(!window.RB_PWA||isInstalled()||installHidden)return "";
  return '<section class="card due"><div class="name" style="font-size:16px">Install RentBell on this device</div><div class="sub">It gets its own icon and opens like an app.</div><div class="acts"><button class="btn pri grow" data-act="install">Install</button><button class="btn" data-act="installhide">Not now</button></div></section>';
}
function doInstall(){
  if(deferredInstall){const p=deferredInstall;p.prompt();p.userChoice.then(()=>{deferredInstall=null;render();}).catch(()=>{});return;}
  const ua=navigator.userAgent, here=location.href.split("#")[0];
  let how;
  if(/iPhone|iPad|iPod/.test(ua))how='<p class="hint">On iPhone or iPad, open this page in Safari. Tap the Share button at the bottom, then choose "Add to Home Screen".</p>';
  else if(/Android/.test(ua))how='<p class="hint">This browser cannot install apps by itself. Open RentBell in Chrome, then tap the menu (\u22EE), choose "Add to Home screen" and tap "Install".</p><a class="btn pri block" href="intent://'+esc(here.replace(/^https?:\/\//,""))+'#Intent;scheme=https;package=com.android.chrome;end">Open in Chrome</a>';
  else how='<p class="hint">On a computer, open this page in Chrome or Edge and click the install icon at the right end of the address bar. Other browsers can still use RentBell as a normal page.</p>';
  sheetState={kind:"install"};
  openSheet(head("Install RentBell")+how+'<label>Link to this app<input type="text" id="i-link" readonly value="'+esc(here)+'"></label><button class="btn block" data-act="copylink">Copy link</button>');
}
async function notifyOn(){
  if(!("Notification" in window)||!navigator.serviceWorker){toast("This browser cannot show notifications.");return;}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){toast("Notifications are blocked. Allow them for RentBell in your phone settings.");return;}
  const reg=await navigator.serviceWorker.ready;
  if(!("periodicSync" in reg)){toast("Daily notifications need the installed app on an Android phone with Chrome.");return;}
  try{await reg.periodicSync.register("rent-check",{minInterval:12*60*60*1000});}
  catch(e){toast("Install RentBell on your home screen first, then turn this on again.");return;}
  state.settings.notify=true;commit();closeSheet();saveForWorker();
  reg.showNotification("RentBell",{body:"Daily notifications are on.",icon:"icon-192.png",badge:"icon-192.png",tag:"rent-info"});
}
async function notifyOff(){
  try{const reg=await navigator.serviceWorker.ready;if("periodicSync" in reg)await reg.periodicSync.unregister("rent-check");}catch(e){}
  state.settings.notify=false;commit();closeSheet();toast("Daily notifications turned off");
}
async function notifyTest(){

/* Where records live: the owner and invited family editors share one rent book; anyone else gets a private book of their own. */
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use)){cloud="local";setSync();return;}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db){cloud="local";setSync();return;}
    const me=user?await user.me():{id:null,isOwner:false,canEdit:false};
    myId=me.id||null;amOwner=!!me.isOwner;
    let ref;
    if(me.isOwner||me.canEdit){mode="shared";ref=db.doc("app/state");}
    else if(me.id){mode="private";ref=db.doc("data/users/"+me.id+"/state");}
    else{cloud="local";setSync();return;}
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error("slow")),10000))]);
    docRef=ref;
    if(snap.exists){const remote=normalize(JSON.parse(JSON.stringify(snap.data())));
      if(remote.updatedAt>state.updatedAt){state=remote;cache();cloud="ok";}
      else if(state.updatedAt>remote.updatedAt){await push();}
      else cloud="ok";
    }else if(state.tenants.length){await push();}else cloud="ok";
    render();
    if(mode==="shared"){
      window.claude.use("assets").then(a=>{assetsNS=a||null;}).catch(()=>{});
      db.doc("app/backup").get().then(b=>{if(b.exists){const d=b.data()||{};if(typeof d.lastBackupAt==="string"&&!isNaN(Date.parse(d.lastBackupAt)))lastAuto=d.lastBackupAt;if(typeof d.sheetUrl==="string"&&d.sheetUrl.indexOf("https://docs.google.com/")===0)sheetUrl=d.sheetUrl;}}).catch(()=>{});
      ref.onSnapshot(sn=>{if(!sn.exists||sn.metadata.hasPendingWrites||saving||dirty||pendingLocal)return;
        const r=normalize(JSON.parse(JSON.stringify(sn.data())));
        if(r.updatedAt!==state.updatedAt){state=r;cache();render();}},()=>{});
    }
  }catch(e){cloud="local";}
  setSync();
}

/* ---------- rent logic ---------- */
function dues(t){
  const now=today(), out=[], s=fromIso((t.start||ymKey(now))+"-01"), end=new Date(now.getFullYear(),now.getMonth()+1,1);
  for(let d=s,i=0;d<=end&&i<240;d=new Date(d.getFullYear(),d.getMonth()+1,1),i++){
    const key=ymKey(d);if(t.left&&key>t.left.slice(0,7))break;
    const due=dueDate(d.getFullYear(),d.getMonth(),+t.dueDay||1), paid=paidFor(t.id,key);
    const rent=rentFor(t,key), extra=chargesFor(t.id,key).reduce((a,c)=>a+(+c.amount||0),0), total=rent+extra;
    out.push({key,due,paid,rent,extra,total,bal:Math.max(0,total-paid),late:diff(now,due)});
  }
  return out;
}
function status(t){

  if(late.length){const ms=late.concat(now);r.kind="late";r.months=ms;r.amount=ms.reduce((a,d)=>a+d.bal,0);r.date=late[0].due;r.n=late[0].late;
    r.needs=S.daily?t.lastReminded!==todayS:!(t.lastReminded&&t.lastReminded>iso(late[0].due));}
  else if(now.length){r.kind="due";r.months=now;r.amount=now[0].bal;r.date=now[0].due;r.needs=S.onDue&&t.lastReminded!==todayS;}
  else if(soon.length&&S.before){const d=soon[0], ws=new Date(d.due);ws.setDate(ws.getDate()-(+S.daysBefore||0));
    r.kind="soon";r.months=[d];r.amount=d.bal;r.date=d.due;r.n=-d.late;r.needs=!(t.lastReminded&&t.lastReminded>=iso(ws));}

function insight(t){
  const ds=dues(t).filter(d=>d.late>=0), lates=[];
  for(const d of ds)if(d.bal===0&&d.total>0){const ps=state.payments.filter(p=>p.tid===t.id&&p.month===d.key).map(p=>p.date).sort();if(ps.length)lates.push(Math.max(0,diff(fromIso(ps[ps.length-1]),d.due)));}
  const last=lates.slice(-6), open=ds.filter(d=>d.bal>0&&d.late>0), cur=open.length?open[0].late:0;
  if(!last.length&&!cur)return {cls:"new",label:"New",score:null,text:"No payment history yet."};

  return {score,avg:a,cls:score>=80?"good":score>=50?"mid":"late",label:score>=80?"Reliable":score>=50?"Sometimes late":"Often late",

  const l=tl(t), L=T[l], d=dues(t).find(x=>x.key===p.month), bal=d?d.bal:0;
  return sign(fill(L.rec,Object.assign(base(t),{amt:money(p.amount),month:fMonth(p.month,l),date:fDate(fromIso(p.date),l),mode:p.mode,bal:bal>0?fill(L.part,{bal:money(bal)}):L.full})));
}
const noticeText=(t,k,extra)=>sign(fill(T[tl(t)][k],Object.assign(base(t),extra||{})));
const meterText=(t,r)=>noticeText(t,"meter",{month:fMonth(r.month,tl(t)),prev:r.prev,curr:r.curr,units:r.units,rate:"\u20B9"+r.rate,amt:money(r.amount)});

function recordLines(){
  return state.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{const t=tenant(p.tid);
    return fDay(p.date)+" | "+fMonth(p.month,"en",true)+" rent | "+(t?t.name:"Removed tenant")+" | "+(t?"+"+waPhone(t):"-")+" | "+(t&&t.room?t.room:"-")+" | "+money(p.amount)+" | "+p.mode;});
}
function recordText(maxEncoded){
  let lines=recordLines();const total=lines.length;
  const pend=state.tenants.map(t=>{let a=0;for(const d of dues(t))if(d.late>=0)a+=d.bal;return a>0?t.name+" | +"+waPhone(t)+" | "+(t.room||"-")+" | "+money(a):"";}).filter(Boolean);
  const adv=state.tenants.map(t=>{const a=advanceHeld(t.id);return a?t.name+" | "+(t.room||"-")+" | "+money(a):"";}).filter(Boolean);
  const build=()=>"RentBell rent record, "+fDay(iso(today()))+"\n\nRENT RECEIVED\nReceived on | Rent month | Tenant | Phone | Home | Amount | Paid by\n"+(lines.length?lines.join("\n"):"No payments recorded yet.")
    +(lines.length<total?"\n(Latest "+lines.length+" of "+total+" payments. Use Copy rent record in the app for the full list.)":"")
    +"\n\nPENDING NOW\n"+(pend.length?"Tenant | Phone | Home | Amount\n"+pend.join("\n"):"Nothing is pending.")
    +"\n\nADVANCE HELD\n"+(adv.length?"Tenant | Home | Amount\n"+adv.join("\n"):"No advance recorded.");
  let txt=build();
  if(maxEncoded)while(lines.length>1&&encodeURIComponent(txt).length>maxEncoded){lines=lines.slice(0,-1);txt=build();}
  return txt;
}

  if(!rows.length)return h+homes+'<p class="hint">No tenants were renting in this month.</p>';

async function saveMeter(){
  const id=sheetState.id, t=tenant(id), month=$("m-month").value, p=+$("m-prev").value, c=+$("m-curr").value, rate=+$("m-rate").value;
  const err=!/^\d{4}-\d{2}$/.test(month)?"Choose the month.":$("m-prev").value===""||$("m-curr").value===""?"Enter both meter readings.":c<p?"The current reading must be the same as or more than the previous reading.":!(rate>0)?"Enter the rate per unit.":"";
  if(err){$("m-err").textContent=err;return;}
  const units=Math.round((c-p)*100)/100, amount=Math.round(units*rate), f=$("m-photo")&&$("m-photo").files[0];
  let photoId="";
  if(f&&assetsNS){$("m-err").textContent="Saving the photo";try{photoId=(await assetsNS.upload(f)).id||"";}catch(e){toast("The photo could not be saved. The reading is saved without it.");}}
  const old=state.readings.filter(r=>r.tid===id&&r.month===month).map(r=>r.id);
  state.readings=state.readings.filter(r=>!old.includes(r.id));state.charges=state.charges.filter(x=>!old.includes(x.readingId));
  const r={id:uid(),tid:id,month,prev:p,curr:c,rate,units,amount,photoId};
  state.readings.push(r);if(amount>0)state.charges.push({id:uid(),tid:id,month,type:"elec",label:"",amount,readingId:r.id});
  state.settings.unitRate=rate;commit();
  const text=meterText(t,r);
  openSheet(head("Electricity bill saved",id)+'<p class="hint">'+units+' units, '+money(amount)+', added to '+fMonth(month,"en")+'.</p>'+(photoId?'<img class="thumb" alt="Meter photo" src="/_blob/'+encodeURIComponent(photoId)+'">':"")
   +'<div class="msg open">'+esc(text)+'</div><a class="btn wa block" target="_blank" rel="noopener" href="'+esc(waLink(t,text))+'">'+WA+'Send bill on WhatsApp</a>'
   +'<p class="hint">WhatsApp opens with the bill text. To send the meter photo too, tap the paperclip in WhatsApp and pick the photo from your gallery.</p>');
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("nav button");if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return;}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, id=el.dataset.id, sid=sheetState&&sheetState.id;
  if(a==="veil"){if(e.target===el)closeSheet();return;}
  if(a==="close")closeSheet();
  else if(a==="close-soon")setTimeout(closeSheet,400);
  else if(a==="eye"){clearTimeout(revealTimer);reveal=!reveal;if(reveal)revealTimer=setTimeout(()=>{reveal=false;applyHide();},2000);applyHide();}
  else if(a==="settings")sheetSettings();
  else if(a==="addtenant")sheetTenantForm();
  else if(a==="edittenant")sheetTenantForm(id);
  else if(a==="savetenant")saveTenant();
  else if(a==="tenant")sheetTenant(id);
  else if(a==="pay")sheetPay(id,el.dataset.month);
  else if(a==="savepay")savePay();
  else if(a==="paymode"){sheetState.mode=id;pick("p-modes",id);$("p-oktxt").textContent=id==="Cash"?"I counted the cash and it is correct":"I checked my bank or UPI statement and the money is there";}
  else if(a==="rent")sheetRent(id);
  else if(a==="saverent"){const amt=Math.round(+$("r-amt").value), from=$("r-from").value, t=tenant(sid);
    if(!(amt>0)){$("r-err").textContent="Enter the new rent amount.";return;}
    if(!/^\d{4}-\d{2}$/.test(from)){$("r-err").textContent="Choose the month the new rent starts.";return;}
    t.rents=arr(t.rents).filter(r=>r.from!==from).concat([{from,amount:amt}]).sort((x,y)=>x.from.localeCompare(y.from));commit();
    const text=noticeText(t,"rentup",{amt:money(amt),month:fMonth(from,tl(t))});
    sheetNotice(sid,'<section class="card due"><div class="name" style="font-size:16px">Rent is now '+money(amt)+' from '+fMonth(from,"en")+'. Tell the tenant:</div><div class="msg open">'+esc(text)+'</div><a class="btn wa block" target="_blank" rel="noopener" href="'+esc(waLink(t,text))+'">'+WA+'Send rent change notice</a></section>');}
  else if(a==="charge")sheetCharge(id);
  else if(a==="chargetype"){sheetState.type=id;pick("c-types",id);$("c-lblwrap").style.display=id==="other"?"":"none";}
  else if(a==="savecharge"){const amt=Math.round(+$("c-amt").value), month=$("c-month").value, label=$("c-label").value.trim();
    if(!(amt>0)){$("c-err").textContent="Enter the charge amount.";return;}
    if(!/^\d{4}-\d{2}$/.test(month)){$("c-err").textContent="Choose the month to add it to.";return;}
    if(sheetState.type==="other"&&!label){$("c-err").textContent="Type a name for this charge.";return;}
    state.charges.push({id:uid(),tid:sid,month,type:sheetState.type,label,amount:amt});commit();sheetTenant(sid);toast("Charge added to "+fMonth(month,"en"));}
  else if(a==="delcharge"){const ch=state.charges.find(c=>c.id===id);if(ch&&ch.readingId)state.readings=state.readings.filter(r=>r.id!==ch.readingId);state.charges=state.charges.filter(c=>c.id!==id);commit();sheetTenant(sid);toast("Charge deleted");}
  else if(a==="advance")sheetAdvance(id);
  else if(a==="advkind"){sheetState.adv=id;pick("a-kinds",id);}
  else if(a==="saveadvance"){const amt=Math.round(+$("a-amt").value), date=$("a-date").value;
    if(!(amt>0)){$("a-err").textContent="Enter the amount.";return;}
    if(!date){$("a-err").textContent="Choose the date.";return;}
    state.advances.push({id:uid(),tid:sid,kind:sheetState.adv,amount:amt,date,note:$("a-note").value.trim()});commit();sheetTenant(sid);toast("Advance saved");}
  else if(a==="deladv"){state.advances=state.advances.filter(x=>x.id!==id);commit();sheetTenant(sid);toast("Entry deleted");}
  else if(a==="notice")sheetNotice(id);
  else if(a==="unlock")tryUnlock();
  else if(a==="updatenow"){location.href=location.pathname+"?u="+encodeURIComponent(newVersion);}
  else if(a==="updatelater"){const b=$("upd");if(b)b.remove();}
  else if(a==="restoresafe"){try{const o=JSON.parse(localStorage.getItem("rentbell.safe"));if(!Array.isArray(o.tenants))throw 0;const keepPin=state.settings.pin;state=normalize(o);if(keepPin)state.settings.pin=keepPin;closeSheet();commit();toast("Records from before the update are back");}catch(x){toast("No earlier copy was found.");}}
  else if(a==="install")doInstall();
  else if(a==="installhide"){installHidden=true;render();}
  else if(a==="copylink"){const l=$("i-link");(navigator.clipboard?navigator.clipboard.writeText(l.value):Promise.reject()).then(()=>toast("Link copied")).catch(()=>{l.select();toast("Select the link and copy it.");});}
  else if(a==="notifyon")notifyOn();
  else if(a==="notifyoff")notifyOff();
  else if(a==="notifytest")notifyTest();
  else if(a==="meter")sheetMeter(id);
  else if(a==="savemeter")saveMeter();
  else if(a==="delreading"){state.readings=state.readings.filter(r=>r.id!==id);state.charges=state.charges.filter(c=>c.readingId!==id);commit();sheetTenant(sid);toast("Reading deleted");}
  else if(a==="renew"||a==="left")sheetDate(id,a);
  else if(a==="unleft"){delete tenant(id).left;commit();sheetTenant(id);}
  else if(a==="savedate"){const d=$("d-date").value, t=tenant(sid);if(!d){$("d-err").textContent="Choose the date.";return;}
    if(sheetState.kind==="renew"){t.agreeEnd=d;commit();closeSheet();toast("Agreement date updated");}else{t.left=d;commit();sheetTenant(sid);toast("Marked as moved out");}}
  else if(a==="addunit"){const n=$("u-name").value.trim();if(!n){toast("Type the home or room name first.");return;}if(state.units.some(u=>same(u.name,n))){toast("That name is already in the list.");return;}state.units.push({id:uid(),name:n});commit();}
  else if(a==="delunit"){state.units=state.units.filter(u=>u.id!==id);commit();}
  else if(a==="pinon"||a==="pinchange"||a==="pinoff"){const m=$("k-master").value.trim(), p=$("k-pin").value.trim(), P=state.settings.pin;
    (async()=>{
      if(a==="pinon"){if(!/^\d{6,}$/.test(m)){$("k-err").textContent="The master code needs 6 digits or more.";return;}if(!/^\d{4,6}$/.test(p)){$("k-err").textContent="The PIN needs 4 to 6 digits.";return;}if(m===p){$("k-err").textContent="The PIN and the master code must be different.";return;}
        const salt=uid();state.settings.pin={salt,pinHash:await hashStr(salt+":"+p),masterHash:await hashStr(salt+":"+m)};unlocked=true;closeSheet();commit();toast("Lock is on. Keep the master code safe.");return;}
      if(await hashStr(P.salt+":"+m)!==P.masterHash){$("k-err").textContent="That master code is wrong.";return;}
      if(a==="pinoff"){delete state.settings.pin;closeSheet();commit();toast("Lock turned off");return;}
      if(!/^\d{4,6}$/.test(p)){$("k-err").textContent="The new PIN needs 4 to 6 digits.";return;}
      P.pinHash=await hashStr(P.salt+":"+p);closeSheet();commit();toast("PIN changed");})();}
  else if(a==="togglemsg"){openMsgs[id]=!openMsgs[id];el.classList.toggle("open");}
  else if(a==="month"){viewMonth=id;render();}
  else if(a==="sent"){const t=tenant(id);if(t){const inSheet=sheetState&&sheetState.kind==="tenant";setTimeout(()=>{const at=new Date().toISOString(), by=myName();t.lastReminded=iso(today());t.lastAt=at;t.lastBy=by;t.lastById=myId||"";t.log=[{at,by,byId:myId||""}].concat(arr(t.log)).slice(0,15);commit();if(inSheet)sheetTenant(id);},400);}}
  else if(a==="setlang"){const t=tenant(id);if(t){t.lang=el.dataset.lang;const k=sheetState&&sheetState.kind;commit();if(k==="tenant")sheetTenant(id);else if(k==="notice")sheetNotice(id);}}
  else if(a==="formlang"){const keep=readForm();sheetState.lang=el.dataset.lang;sheetState.def=$("f-def").checked;drawForm(null,keep);}
  else if(a==="deflang"){state.settings.lang=el.dataset.lang;commit();document.querySelectorAll('[data-act="deflang"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.settings.lang));}
  else if(a==="savesettings"){const S=state.settings;S.owner=$("s-owner").value.trim();S.upi=$("s-upi").value.trim();S.hide=$("s-hide").checked;S.before=$("s-before").checked;S.daysBefore=Math.min(15,Math.max(1,Math.round(+$("s-days").value)||3));S.onDue=$("s-ondue").checked;S.daily=$("s-daily").checked;S.cc=$("s-cc").value.replace(/\D/g,"")||"91";S.mail=$("s-mail").value.trim();if($("s-me")){deviceName=$("s-me").value.trim();try{localStorage.setItem(ME_KEY,deviceName);}catch(x){}}closeSheet();commit();toast("Settings saved");}
  else if(a==="delpay"){state.payments=state.payments.filter(p=>p.id!==id);commit();sheetTenant(sid);toast("Payment deleted");}
  else if(a==="deltenant"){$("confirm").innerHTML='<section class="card late"><div class="name">Remove this tenant and all their records?</div><div class="acts"><button class="btn danger" data-act="deltenant-yes" data-id="'+id+'">Yes, remove</button><button class="btn" data-act="deltenant-no">Keep</button></div></section>';$("confirm").scrollIntoView({block:"nearest"});}
  else if(a==="deltenant-no")$("confirm").innerHTML="";
  else if(a==="deltenant-yes"){state.tenants=state.tenants.filter(t=>t.id!==id);for(const k of ["payments","charges","advances","readings"])state[k]=state[k].filter(p=>p.tid!==id);closeSheet();commit();toast("Tenant removed");}
  else if(a==="mailrecord"){const m=$("s-mail").value.trim();if(m!==state.settings.mail){state.settings.mail=m;commit();}}
  else if(a==="copyrecord"){const txt=recordText();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Rent record copied. Paste it into an email or note.")).catch(()=>{$("s-restore").value=txt;$("s-restore").select();toast("Select all the text in the box below and copy it.");});}
  else if(a==="backup"){const txt=JSON.stringify(state);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Backup copied. Paste it into your notes or email.")).catch(()=>{$("s-restore").value=txt;$("s-restore").select();toast("Select all the text in the box and copy it.");});}
  else if(a==="restore"){try{const o=JSON.parse($("s-restore").value);if(!Array.isArray(o.tenants))throw 0;const keepPin=state.settings.pin;state=normalize(o);if(keepPin)state.settings.pin=keepPin;closeSheet();commit();toast("Records restored");}catch(x){toast("That is not a RentBell backup. Paste the full backup text.");}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="l-pin")tryUnlock();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();return;}
  if(state.settings.pin&&hiddenAt&&Date.now()-hiddenAt>60000)unlocked=false;
  if(!sheetState||!unlocked)render();});

render();setSync();initCloud();saveForWorker();
if(justUpdated)toast("Updated to version "+APP_VERSION+". Your records are safe.");
if(location.search.indexOf("u=")>=0)try{history.replaceState(null,"",location.pathname);}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
setTimeout(checkUpdate,5000);setInterval(checkUpdate,600000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
</script>
</body>
</html>
